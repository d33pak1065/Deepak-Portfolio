<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Sri Deepak Bolisetti | Software Engineer | Flutter & Full Stack Developer
    </title>
    <meta
      name="description"
      content="Portfolio of Sri Deepak Bolisetti, a Software Engineer building mobile and full-stack applications with Flutter, Dart, React, Node.js, Firebase, REST APIs, and databases."
    />

    <!--
      Canonical URL — set once a production domain is live, e.g.:
      <link rel="canonical" href="https://your-domain.com/" />
      Left unset for now rather than pointing at a domain that doesn't exist yet.
    -->

    <!-- Open Graph — update og:image once a real preview asset is added -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Sri Deepak Bolisetti | Software Engineer | Flutter & Full Stack Developer"
    />
    <meta
      property="og:description"
      content="Software Engineer building mobile and full-stack applications with Flutter, React, Node.js, Firebase, REST APIs, and production deployment."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sri Deepak Bolisetti | Software Engineer | Flutter & Full Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Software Engineer building mobile and full-stack applications with Flutter, React, Node.js, Firebase, REST APIs, and production deployment."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts — preconnect + stylesheet link (not a CSS @import) so the
         browser discovers and fetches them as early as possible -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
